name: Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-project/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android-project/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /opt/
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - name: Build Debug APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon --no-parallel --max-workers=2 --console=plain --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoMirrorCore-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Release APK
        working-directory: android-project
        run: gradle assembleRelease --no-daemon --no-parallel --max-workers=2 --console=plain --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoMirrorCore-release-apk
          path: android-project/app/build/outputs/apk/release/*.apk
          retention-days: 30
